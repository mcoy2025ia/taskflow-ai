<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="50%" stop-color="#1d70e8"/>
      <stop offset="100%" stop-color="#6FB1FC"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#4364F7"/>
    </linearGradient>
  </defs>

  <!-- Hexagon outline (cyber style) -->
  <polygon points="150,15 260,78 260,202 150,265 40,202 40,78" fill="none" stroke="url(#blueGrad)" stroke-width="7" stroke-linejoin="round"/>
  
  <!-- Stylized Y / V nodes inside -->
  <!-- Main Y/V shape inside the hex -->
  <path d="M90,85 L150,140 L210,85" fill="none" stroke="url(#silverGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150,140 L150,210" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Left side circuit connections (Silver/White) -->
  <path d="M80,135 L125,180" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="80" cy="135" r="7" fill="#FFFFFF"/>
  
  <path d="M100,105 L135,140" fill="none" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="105" r="7" fill="#E2E8F0"/>

  <!-- Right side circuit connections (Electric Blue) -->
  <path d="M220,135 L175,180" fill="none" stroke="#1d70e8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="220" cy="135" r="7" fill="#1d70e8"/>
  
  <path d="M200,105 L165,140" fill="none" stroke="#0066cc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="105" r="7" fill="#0066cc"/>

  <!-- MCOY Text -->
  <g transform="translate(0, 290)">
    <text x="150" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" text-anchor="middle" fill="url(#silverGrad)" letter-spacing="1.5">
      MCO<tspan fill="#1d70e8">Y</tspan>
    </text>
  </g>

  <!-- AI + DATA STRATEGY Subtitle -->
  <g transform="translate(0, 332)">
    <text x="150" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#94A3B8" letter-spacing="5.5">
      AI + DATA STRATEGY
    </text>
  </g>
</svg>
